buildscript {
  ext.getExtOrDefault = { name, fallback ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def safeExtGet = { prop, fallback ->
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "com.inforahul.backgroundlocation"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
    consumerProguardFiles "consumer-rules.pro"
  }

  buildFeatures {
    buildConfig true
  }

  sourceSets {
    main {
      java.srcDirs = ["src/main/java"]
      manifest.srcFile "src/main/AndroidManifest.xml"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet('kotlinVersion', '1.9.24')}"
  implementation "com.google.android.gms:play-services-location:21.3.0"
  implementation "androidx.core:core-ktx:1.13.1"
}
